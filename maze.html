<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragon Maze | GE & LE Studios</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#09090e;color:#f2e7d1;font-family:system-ui,Arial;text-align:center}header{padding:16px;border-bottom:1px solid #6b4c25;display:flex;align-items:center;justify-content:space-between;gap:8px}a{color:#d9b875;text-decoration:none}h1{font-family:Georgia,serif;color:#d9b875;font-size:clamp(20px,4vw,34px)}main{max-width:650px;margin:auto;padding:10px 12px 40px}.stats{display:flex;justify-content:space-around;gap:8px;margin:12px 0}.stats>div{background:#171722;border:1px solid #5b4a33;border-radius:12px;padding:10px;flex:1}.stats strong{display:block;font-size:1.4rem}.board{display:grid;grid-template-columns:repeat(9,1fr);aspect-ratio:1;margin:14px auto;max-width:min(94vw,560px);border:2px solid #9b7442;background:#07070b;touch-action:none}.cell{border:1px solid #25232c;display:grid;place-items:center;font-size:clamp(11px,3.5vw,27px)}.wall{background:#34303c}.hazard{background:linear-gradient(135deg,#f6a744,#b94b08);box-shadow:inset 0 0 12px #ffe18b;color:#18100a}.player{background:#152e25;box-shadow:inset 0 0 0 2px #7de6a3}.goal{background:#16384b;box-shadow:inset 0 0 0 2px #68d9ff}.controls{display:grid;grid-template-columns:repeat(3,76px);justify-content:center;gap:8px;margin:20px auto}.controls button{min-height:60px}button{border:1px solid #9d7a48;border-radius:12px;background:#1d1c27;color:#f2e7d1;font-size:21px;cursor:pointer;padding:10px}button:active{background:#6e4922}.wide{font-size:15px;margin:6px}.message{min-height:52px;color:#e6c68d;font-weight:600}small{color:#c6bdb2}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}</style></head><body><header><a href="index.html">← Studio</a><strong>GE & LE STUDIOS</strong><a href="https://forged-games.vercel.app">All Games ↗</a></header><main><h1>🐉 Dragon Maze</h1><p>Reach the blue portal. Never touch the glowing bricks!</p><div class="stats"><div>LEVEL<strong id="level">1 / 10</strong></div><div>STEPS<strong id="steps">0</strong></div><div>ATTEMPTS<strong id="attempts">1</strong></div></div><div class="board" id="board" role="grid" aria-label="Dragon maze"></div><div class="message" id="message" aria-live="polite"></div><div class="controls"><button class="up" data-move="up" aria-label="Move up">▲</button><button class="left" data-move="left" aria-label="Move left">◀</button><button class="down" data-move="down" aria-label="Move down">▼</button><button class="right" data-move="right" aria-label="Move right">▶</button></div><button class="wide" id="restart">Restart level</button><button class="wide" id="next" hidden>Next level →</button><p><small>Swipe or use the arrows. Glowing orange = danger. Dark walls = blocked. Every level has a guaranteed safe route.</small></p></main><script>
(()=>{'use strict';const N=9,board=document.getElementById('board'),msg=document.getElementById('message');let level=1,steps=0,attempts=1,player=0,goal=80,cells=[],won=false;
const idx=(x,y)=>y*N+x,xy=i=>[i%N,Math.floor(i/N)],neighbors=i=>{let [x,y]=xy(i);return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>a>=0&&a<N&&b>=0&&b<N).map(([a,b])=>idx(a,b))};
function generate(){let success=false;for(let tries=0;tries<100&&!success;tries++){cells=Array(81).fill('wall');let current=0,path=[0],visited=new Set([0]);while(current!==goal){const options=neighbors(current).filter(v=>!visited.has(v));if(!options.length)break;options.sort((a,b)=>{const [ax,ay]=xy(a),[bx,by]=xy(b);return (Math.abs(8-ax)+Math.abs(8-ay))-(Math.abs(8-bx)+Math.abs(8-by))});const pick=Math.random()<(0.77-level*.035)?options[0]:options[Math.floor(Math.random()*options.length)];current=pick;visited.add(current);path.push(current)}if(current!==goal)continue;const safe=new Set(path);for(const p of path)cells[p]='floor';const extra=Math.max(25-level*2,6);for(let j=0;j<extra;j++){const p=Math.floor(Math.random()*81);if(!safe.has(p))cells[p]='floor'}const dangerChance=Math.min(.17+level*.055,.74);for(let i=0;i<81;i++)if(!safe.has(i)&&cells[i]==='floor'&&Math.random()<dangerChance)cells[i]='hazard';for(let i=0;i<81;i++)if(!safe.has(i)&&cells[i]==='wall'&&Math.random()<.24)cells[i]='hazard';cells[0]='floor';cells[goal]='floor';success=true}if(!success){cells=Array(81).fill('wall');for(let x=0;x<9;x++)cells[idx(x,0)]='floor';for(let y=0;y<9;y++)cells[idx(8,y)]='floor';for(let y=1;y<8;y++)cells[idx(7,y)]='hazard'}}
function render(){document.getElementById('level').textContent=level+' / 10';document.getElementById('steps').textContent=steps;document.getElementById('attempts').textContent=attempts;board.replaceChildren(...cells.map((v,i)=>{const d=document.createElement('div');d.className='cell '+v+(i===player?' player':i===goal?' goal':'');d.setAttribute('role','gridcell');d.textContent=i===player?'🐉':i===goal?'✦':v==='hazard'?'🔥':'';return d}))}
function start(){steps=0;player=0;won=false;generate();document.getElementById('next').hidden=true;msg.textContent='Find the safe route to the portal.';render()}
function move(dir){if(won)return;const [x,y]=xy(player),delta={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];if(!delta)return;const nx=x+delta[0],ny=y+delta[1];if(nx<0||nx>=N||ny<0||ny>=N)return;const target=idx(nx,ny);if(cells[target]==='wall'){msg.textContent='Stone wall! Find another route.';return}if(cells[target]==='hazard'){attempts++;msg.textContent='🔥 You touched a glowing brick! Try again.';steps=0;player=0;render();return}player=target;steps++;if(player===goal){won=true;msg.textContent=level===10?'🏆 You conquered all ten Dragon Mazes!':'🐉 Portal reached! Level '+level+' complete.';document.getElementById('next').hidden=level===10}else msg.textContent='Stay clear of the glowing bricks.';render()}
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.move)));document.getElementById('restart').onclick=()=>{attempts++;start()};document.getElementById('next').onclick=()=>{if(level<10){level++;attempts=1;start()}};document.addEventListener('keydown',e=>{const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();move(d)}});let touch=null;board.addEventListener('touchstart',e=>{touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});board.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');touch=null},{passive:true});start()})();
</script></body></html>
